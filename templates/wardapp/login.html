<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Ward 119 Civic Survey AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: radial-gradient(circle at top, #1e293b, #0f172a);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
    }
  </style>
</head>
<body>
  <div class="card login-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <span class="brand-badge" style="font-size: 0.85rem; padding: 0.3rem 0.8rem;">Ward 119 • Old Bowenpally</span>
      <h1 style="font-size: 1.5rem; margin-top: 1rem; font-weight: 700;">Survey Intelligence</h1>
      <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.4rem;">Testing & Validation Environment</p>
    </div>

    {% if error %}
      <div style="background-color: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: #fca5a5; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: 0.875rem;">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="password">Shared Access Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter app password" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem;">
        Unlock Testing Console
      </button>
    </form>
  </div>
</body>
</html>
